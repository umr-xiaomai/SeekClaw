<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="clawGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Hexagon Base -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="#0b0f19" stroke="url(#clawGlow)" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Cyber Claws Dynamic Path -->
  <path d="M 25 35 Q 50 15 75 35 Q 60 55 50 78 Q 40 55 25 35 Z" fill="none" stroke="url(#clawGlow)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Center Core Node -->
  <circle cx="50" cy="45" r="8" fill="#10b981" />
  <circle cx="50" cy="45" r="4" fill="#ffffff" />

  <!-- Accent Rays -->
  <line x1="50" y1="20" x2="50" y2="30" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="65" x2="20" y2="75" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" />
  <line x1="70" y1="65" x2="80" y2="75" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
</svg>
